<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Monitoring Dashboard</title>
  <script>
    try {
      var saved = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>DevOps Monitor</h1>
      <nav>
        <a href="#/overview" data-route="overview" class="active">Overview</a>
        <a href="#/services" data-route="services">Services</a>
        <a href="#/deploys" data-route="deploys">Deploys</a>
        <a href="#/hosts" data-route="hosts">Hosts</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button">Toggle theme</button>
    </aside>
    <main class="main" id="view"></main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
